<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIASTICA Cockpit</title>
<link rel="stylesheet" href="style_cockpit.css">
</head>
<body>

<!-- ORB -->
<div class="orb-nav" id="orb">
  <button class="orb-btn" data-platform="geointeligencia">Geo</button>
  <button class="orb-btn" data-platform="erp">ERP</button>
  <button class="orb-btn" data-platform="ultima-milla">UM</button>
  <button class="orb-btn" data-platform="ia">IA</button>
</div>

<!-- Sections -->
<section id="geointeligencia" class="platform">
  <h1>Geointeligencia</h1>
</section>

<section id="erp" class="platform">
  <h1>ERP Transporte</h1>
</section>

<section id="ultima-milla" class="platform">
  <h1>Última Milla</h1>
</section>

<section id="ia" class="platform">
  <h1>IA Logística</h1>
</section>

<!-- Cockpit -->
<div class="cockpit-overlay" id="cockpitOverlay" hidden aria-hidden="true">

  <div class="cockpit-backdrop"></div>

  <div class="cockpit-shell">

    <header class="cockpit-header">
      <div>
        <span id="cockpitBadge">PLATFORM</span>
        <h2 id="cockpitTitle">TIASTICA</h2>
        <p id="cockpitSubtitle"></p>
      </div>

      <button id="cockpitCloseBtn" class="cockpit-close">
        ✕
      </button>
    </header>

    <div class="cockpit-layout">

      <aside class="cockpit-sidebar">
        <button class="cockpit-nav-btn">Overview</button>
        <button class="cockpit-nav-btn">Features</button>
        <button class="cockpit-nav-btn">Analytics</button>
      </aside>

      <main class="cockpit-main">
        <div id="cockpitDynamicContent"></div>
      </main>

    </div>

  </div>

</div>

<script src="script_cockpit.js"></script>
</body>
</html>
